name: CI

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloomwell
          POSTGRES_PASSWORD: test-ci-password-not-a-secret
          POSTGRES_DB: bloomwell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://bloomwell:test-ci-password-not-a-secret@localhost:5432/bloomwell_test
          APP_ENV: test
          APP_SECRET_KEY: test-ci-environment-key-must-be-at-least-32-chars-long
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://bloomwell:test-ci-password-not-a-secret@localhost:5432/bloomwell_test
          APP_ENV: test
          APP_SECRET_KEY: test-ci-environment-key-must-be-at-least-32-chars-long
        run: |
          cd backend
          pytest -v

      - name: Dependency Vulnerability Audit
        continue-on-error: true
        run: |
          echo "Running pip-audit on backend dependencies (non-blocking report)..."
          pip-audit -r backend/requirements.txt || true

  mobile:
    name: Mobile Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Verify Flutter Code Analysis
        run: |
          cd mobile
          flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        run: |
          cd mobile
          flutter test
